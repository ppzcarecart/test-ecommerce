<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LiveBoutique">
  <defs>
    <radialGradient id="lb-disc" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1d1d22"/>
      <stop offset="60%" stop-color="#101013"/>
      <stop offset="100%" stop-color="#070708"/>
    </radialGradient>
    <linearGradient id="lb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#f4dfaa"/>
      <stop offset="50%"  stop-color="#c8a96a"/>
      <stop offset="100%" stop-color="#7a6334"/>
    </linearGradient>
    <linearGradient id="lb-gold-soft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e7cf99"/>
      <stop offset="100%" stop-color="#9a7f48"/>
    </linearGradient>
    <radialGradient id="lb-medallion" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#16161a"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>

    <!-- Top arc: from lower-left around the top to lower-right (text reads upright on the top) -->
    <path id="lb-arc-top" d="M 49.3 180.7 A 220 220 0 0 1 462.7 180.7"/>
  </defs>

  <!-- Disc -->
  <circle cx="256" cy="256" r="248" fill="url(#lb-disc)"/>

  <!-- Outer hairline + main outer ring -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#lb-gold)" stroke-width="1" opacity="0.55"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#lb-gold)" stroke-width="2.5"/>
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#lb-gold)" stroke-width="0.6" opacity="0.4"/>

  <!-- Curved seal text -->
  <text fill="url(#lb-gold-soft)"
        font-family="Georgia, 'Cormorant Garamond', 'Times New Roman', serif"
        font-size="26" letter-spacing="7" font-weight="500">
    <textPath href="#lb-arc-top" startOffset="50%" text-anchor="middle">LIVE · BOUTIQUE</textPath>
  </text>
  <text x="256" y="453" fill="url(#lb-gold-soft)"
        font-family="Georgia, 'Cormorant Garamond', 'Times New Roman', serif"
        font-size="18" letter-spacing="9" font-weight="500"
        text-anchor="middle">ATELIER · MMXXVI</text>

  <!-- Decorative six-point stars at 3 and 9 o'clock (between top/bottom text) -->
  <g fill="url(#lb-gold)">
    <g transform="translate(36 256)">
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
    </g>
    <g transform="translate(476 256)">
      <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"/>
    </g>
  </g>

  <!-- Inner medallion -->
  <circle cx="256" cy="256" r="178" fill="url(#lb-medallion)"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#lb-gold)" stroke-width="2"/>
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#lb-gold)" stroke-width="0.7" opacity="0.55"/>

  <!-- LB monogram: serif, interlocked. The L sits slightly behind the B's bowls. -->
  <g font-family="Georgia, 'Cormorant Garamond', 'Times New Roman', serif"
     font-weight="700"
     fill="url(#lb-gold)">
    <text x="206" y="332" font-size="232" text-anchor="middle">L</text>
    <text x="312" y="332" font-size="232" text-anchor="middle">B</text>
  </g>

  <!-- Subtle gold underline beneath the monogram -->
  <g opacity="0.85">
    <rect x="170" y="356" width="172" height="1.6" fill="url(#lb-gold)"/>
    <circle cx="256" cy="357" r="3" fill="url(#lb-gold)"/>
  </g>
</svg>
