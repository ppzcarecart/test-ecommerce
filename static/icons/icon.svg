<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="LiveBoutique">
  <defs>
    <linearGradient id="lb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161618"/>
      <stop offset="100%" stop-color="#0b0b0c"/>
    </linearGradient>
    <linearGradient id="lb-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7cf99"/>
      <stop offset="55%" stop-color="#c8a96a"/>
      <stop offset="100%" stop-color="#9a7f48"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#lb-bg)"/>
  <rect x="14" y="14" width="484" height="484" rx="100"
        fill="none" stroke="url(#lb-gold)" stroke-width="3" opacity="0.55"/>

  <!-- LB monogram: an L cradling a B, sharing a baseline serif -->
  <g fill="url(#lb-gold)">
    <!-- L -->
    <path d="M132 132
             h44
             v200
             h96
             v44
             H132
             Z"/>
    <!-- B -->
    <path d="M252 132
             h82
             a64 64 0 0 1 38 116
             a72 72 0 0 1 -34 128
             H252
             Z
             M296 168
             v68
             h36
             a34 34 0 0 0 0 -68
             Z
             M296 268
             v72
             h44
             a36 36 0 0 0 0 -72
             Z"
          fill-rule="evenodd"/>
  </g>

  <!-- Baseline accent -->
  <rect x="132" y="392" width="240" height="3" fill="url(#lb-gold)" opacity="0.7"/>
</svg>
